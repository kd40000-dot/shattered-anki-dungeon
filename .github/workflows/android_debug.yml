name: Android debug build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'chatgpt/**'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect Gradle project
        id: gradle-project
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SPD source has not been imported on this branch yet; skipping build."
          fi

      - uses: actions/setup-java@v4
        if: steps.gradle-project.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gradle-project.outputs.present == 'true'

      - name: Build debug APK
        if: steps.gradle-project.outputs.present == 'true'
        run: ./gradlew android:assembleDebug

      - name: Upload APK
        if: steps.gradle-project.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shattered-anki-dungeon-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
