name: Android debug build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'chatgpt/**'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    env:
      SAD_SIGNING_KEYSTORE_B64: ${{ secrets.SAD_SIGNING_KEYSTORE_B64 }}
      SAD_SIGNING_STORE_PASSWORD: ${{ secrets.SAD_SIGNING_STORE_PASSWORD }}
      SAD_SIGNING_KEY_ALIAS: ${{ secrets.SAD_SIGNING_KEY_ALIAS }}
      SAD_SIGNING_KEY_PASSWORD: ${{ secrets.SAD_SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect Gradle project
        id: gradle-project
        shell: bash
        run: |
          if [ -f gradlew ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "SPD source has not been imported on this branch yet; skipping build."
          fi

      - uses: actions/setup-java@v4
        if: steps.gradle-project.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.gradle-project.outputs.present == 'true'

      - name: Configure persistent APK signing
        if: steps.gradle-project.outputs.present == 'true' && env.SAD_SIGNING_KEYSTORE_B64 != ''
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/shattered-anki-dungeon-signing.jks"
          printf '%s' "$SAD_SIGNING_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          echo "SAD_SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "SAD_SIGNING_STORE_PASSWORD=$SAD_SIGNING_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SAD_SIGNING_KEY_ALIAS=$SAD_SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SAD_SIGNING_KEY_PASSWORD=$SAD_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Run core tests
        if: steps.gradle-project.outputs.present == 'true'
        run: ./gradlew core:test

      - name: Build debug APK
        if: steps.gradle-project.outputs.present == 'true'
        run: ./gradlew android:assembleDebug

      - name: Upload installable signed APK
        if: steps.gradle-project.outputs.present == 'true' && env.SAD_SIGNING_KEYSTORE_B64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: shattered-anki-dungeon-stable-signed-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload ephemeral CI APK
        if: steps.gradle-project.outputs.present == 'true' && env.SAD_SIGNING_KEYSTORE_B64 == ''
        uses: actions/upload-artifact@v4
        with:
          name: shattered-anki-dungeon-ephemeral-debug-DO-NOT-INSTALL
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
