name: Android debug build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'chatgpt/**'

permissions:
  contents: read

jobs:
  android-debug:
    # The bootstrap-only main branch has no Gradle project until the upstream
    # import PR lands. PRs containing SPD source build normally.
    if: ${{ hashFiles('gradlew') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew android:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: shattered-anki-dungeon-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
